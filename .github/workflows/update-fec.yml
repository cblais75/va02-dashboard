name: Update FEC data

on:
  schedule:
    # Daily from 6 a.m. Eastern. GitHub cron runs in UTC and is often delayed at the
    # top of the hour, so these run at minute 17: 10:17 UTC (6:17 a.m. EDT) and
    # 11:17 UTC (6:17 a.m. EST). The gate below lets only the first eligible run of
    # each Eastern day fetch; the other exits, and also covers a day GitHub drops one.
    - cron: "17 10 * * *"
    - cron: "17 11 * * *"
  workflow_dispatch: # manual runs always fetch

permissions:
  contents: write

concurrency:
  group: update-fec
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Work out the Eastern date and time
        id: when
        run: |
          echo "date=$(TZ=America/New_York date +%F)" >> "$GITHUB_OUTPUT"
          echo "hour=$(TZ=America/New_York date +%-H)" >> "$GITHUB_OUTPUT"

      # A cache entry keyed by the Eastern date records that today's fetch happened.
      - name: Check whether today's fetch already ran
        id: marker
        if: github.event_name == 'schedule'
        uses: actions/cache/restore@v4
        with:
          path: .fec-marker
          key: fec-fetched-${{ steps.when.outputs.date }}
          lookup-only: true

      - name: Decide whether to fetch
        id: gate
        run: |
          run=true
          reason="manual run"
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "${{ steps.when.outputs.hour }}" -lt 6 ]; then
              run=false; reason="before 6 a.m. Eastern"
            elif [ "${{ steps.marker.outputs.cache-hit }}" = "true" ]; then
              run=false; reason="already fetched on ${{ steps.when.outputs.date }}"
            else
              reason="first run on ${{ steps.when.outputs.date }}"
            fi
          fi
          echo "Eastern ${{ steps.when.outputs.date }} hour ${{ steps.when.outputs.hour }}: run=$run ($reason)"
          echo "run=$run" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: 20

      - name: Fetch FEC data
        if: steps.gate.outputs.run == 'true'
        env:
          FEC_API_KEY: ${{ secrets.FEC_API_KEY }}
        run: node scripts/fetch-fec.mjs

      - name: Commit data/fec.json if it changed
        if: steps.gate.outputs.run == 'true'
        run: |
          git add data/fec.json
          if git diff --cached --quiet; then
            echo "No changes to data/fec.json."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update FEC data"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Record today's fetch
        if: github.event_name == 'schedule' && steps.gate.outputs.run == 'true'
        run: mkdir -p .fec-marker && date -u > .fec-marker/fetched

      - name: Save today's marker
        if: github.event_name == 'schedule' && steps.gate.outputs.run == 'true'
        uses: actions/cache/save@v4
        with:
          path: .fec-marker
          key: fec-fetched-${{ steps.when.outputs.date }}
