name: Watch endorsements

# Once a day, checks both campaign sites for endorsement changes and opens an issue
# for a person to review. It never edits the endorsement list in data/manual.json.
on:
  schedule:
    - cron: "43 11 * * *" # 7:43 a.m. EDT / 6:43 a.m. EST, off the top of the hour
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: watch-endorsements
  cancel-in-progress: false

env:
  ISSUE_TITLE: New endorsements to review

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check campaign sites
        id: watch
        env:
          ISSUE_BODY: ${{ runner.temp }}/endorsement-issue.md
        run: node scripts/watch-endorsements.mjs

      # Open the issue, or add to it if one is already open, before saving what was
      # seen: if this step fails, tomorrow's run reports the same changes again.
      - name: Open or update the review issue
        if: steps.watch.outputs.changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/open-or-comment-issue.sh "$ISSUE_TITLE" "${{ steps.watch.outputs.issue_body }}"

      - name: Save what was seen
        run: |
          git add data/endorsement_watch.json
          if git diff --cached --quiet; then
            echo "No changes to data/endorsement_watch.json."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update endorsement watch snapshot"
          git pull --rebase origin main
          git push origin HEAD:main
